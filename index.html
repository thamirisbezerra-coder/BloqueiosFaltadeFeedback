<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | Feedback</title>
    
    <!-- Fonte Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuração -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#151e2e' },
                        brand: { red: '#ef4444', green: '#10b981' }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script> 
    
    <!-- Babel para compilação do JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js para Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Scrollbars customizadas */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { overflow: hidden; } /* Previne scroll na página toda, foca nas áreas internas */
        
        .toast-enter {
            animation: slideInBottom 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes slideInBottom {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full flex"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const { useState, useEffect, useMemo, useRef } = window.React;

        // Conexão Firebase (ATUALIZADO PARA O MESMO PROJETO DO GESTOR)
        const firebaseConfig = {
            apiKey: "AIzaSyAF_TE28Tbp2nakBGTva1yEEbBCqWvRdJQ", 
            authDomain: "feedback-vendedores.firebaseapp.com", 
            projectId: "feedback-vendedores", 
            storageBucket: "feedback-vendedores.firebasestorage.app", 
            messagingSenderId: "650880422749", 
            appId: "1:650880422749:web:54a258964a6ca8db180eb4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Ícones SVG
        const Icons = {
            Menu: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            PieChart: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            Users: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CheckCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>,
            AlertCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Lock: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            Search: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        };

        function DoughnutChart({ data }) {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                
                const okCount = data.filter(r => r.isOk).length;
                const pendingCount = data.filter(r => r.isPending).length;

                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Com Pendências', 'Tudo OK (Baixado)'],
                        datasets: [{
                            data: [pendingCount, okCount],
                            backgroundColor: ['#ef4444', '#10b981'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '75%',
                        plugins: {
                            legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { family: 'Plus Jakarta Sans', size: 13 } } }
                        }
                    }
                });

                return () => { if(chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);

            return <div className="relative h-64 w-full"><canvas ref={canvasRef}></canvas></div>;
        }

        function BarChart({ data }) {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                
                // Agrupando pendências por segmento
                const segmentMap = {};
                data.forEach(item => {
                    if (item.isPending && item.segment !== 'Sem Segmento') {
                        segmentMap[item.segment] = (segmentMap[item.segment] || 0) + 1;
                    }
                });

                const labels = Object.keys(segmentMap).sort();
                const chartData = labels.map(label => segmentMap[label]);

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Vendedores Bloqueados',
                            data: chartData,
                            backgroundColor: '#ef4444',
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { 
                                beginAtZero: true,
                                ticks: { stepSize: 1, font: { family: 'Plus Jakarta Sans' } },
                                grid: { color: '#f8fafc' }
                            },
                            x: {
                                ticks: { font: { family: 'Plus Jakarta Sans', size: 10 } },
                                grid: { display: false }
                            }
                        }
                    }
                });

                return () => { if(chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);

            return <div className="relative h-64 w-full"><canvas ref={canvasRef}></canvas></div>;
        }

        function StatusModal({ rep, onClose }) {
            if (!rep) return null;
            const isBlocked = rep.isPending;
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden transform transition-all" onClick={e => e.stopPropagation()}>
                        <div className={`p-8 flex flex-col items-center justify-center border-b border-slate-100 ${isBlocked ? 'bg-red-50' : 'bg-emerald-50'}`}>
                            <div className={`p-4 rounded-full mb-4 shadow-sm ${isBlocked ? 'bg-white text-red-500 animate-pulse' : 'bg-white text-emerald-500'}`}>
                                {isBlocked ? <Icons.Lock className="w-12 h-12" /> : <Icons.CheckCircle className="w-12 h-12" />}
                            </div>
                            <h2 className={`text-2xl font-black tracking-tight mb-2 ${isBlocked ? 'text-red-700' : 'text-emerald-700'}`}>
                                {isBlocked ? 'ACESSO BLOQUEADO' : 'ACESSO LIBERADO'}
                            </h2>
                            <p className={`text-center text-sm font-medium ${isBlocked ? 'text-red-600/80' : 'text-emerald-600/80'}`}>
                                {isBlocked ? 'Este vendedor possui pendências no sistema.' : 'Todos os feedbacks foram concluídos!'}
                            </p>
                        </div>
                        <div className="p-6 flex flex-col items-center bg-white">
                            <span className="px-3 py-1 bg-slate-100 text-slate-500 rounded-full text-xs font-bold uppercase tracking-widest mb-3">
                                {rep.segment}
                            </span>
                            <h3 className="text-xl text-slate-800 font-extrabold text-center mb-6">{rep.name}</h3>
                            
                            <div className="flex w-full gap-4 mb-6">
                                <div className="flex-1 bg-red-50 rounded-2xl p-4 border border-red-100 text-center">
                                    <span className="block text-3xl font-extrabold text-red-500">{rep.pendingCount}</span>
                                    <span className="text-[10px] font-bold text-red-400 uppercase tracking-widest mt-1 block">Pendentes</span>
                                </div>
                                <div className="flex-1 bg-emerald-50 rounded-2xl p-4 border border-emerald-100 text-center">
                                    <span className="block text-3xl font-extrabold text-emerald-600">{rep.completedCount}</span>
                                    <span className="text-[10px] font-bold text-emerald-500 uppercase tracking-widest mt-1 block">Respondidos</span>
                                </div>
                            </div>
                            
                            <button onClick={onClose} className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition-all shadow-lg shadow-slate-900/20">
                                Fechar Aviso
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function RepCard({ rep, onClick }) {
            const colorClass = rep.isOk ? 'bg-brand-green' : 'bg-brand-red';
            const lightColorClass = rep.isOk ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200';
            
            return (
                <div 
                    onClick={() => onClick(rep)}
                    className={`bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative flex flex-col cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all duration-200`}
                >
                    <div className={`h-1.5 w-full ${colorClass}`}></div>
                    
                    <div className="p-5 flex-1 flex flex-col">
                        <div className="flex justify-between items-start mb-4">
                            <span className={`text-[10px] px-2 py-1 rounded font-bold uppercase tracking-widest ${lightColorClass} border`}>
                                {rep.segment}
                            </span>
                            {rep.isOk ? <Icons.CheckCircle className="w-5 h-5 text-brand-green" /> : <Icons.Lock className="w-5 h-5 text-brand-red" />}
                        </div>
                        
                        <h3 className="font-extrabold text-slate-800 text-sm leading-snug mb-4 line-clamp-2" title={rep.name}>
                            {rep.name}
                        </h3>
                        
                        <div className="mt-auto space-y-2">
                            <div className="grid grid-cols-2 gap-2">
                                <div className="bg-red-50/50 border border-red-100 rounded-lg p-2 text-center">
                                    <span className="block text-[10px] uppercase font-bold text-red-400">Pendentes</span>
                                    <span className="block font-black text-red-600 text-lg">{rep.pendingCount}</span>
                                </div>
                                <div className="bg-emerald-50/50 border border-emerald-100 rounded-lg p-2 text-center">
                                    <span className="block text-[10px] uppercase font-bold text-emerald-500">Respondidos</span>
                                    <span className="block font-black text-emerald-600 text-lg">{rep.completedCount}</span>
                                </div>
                            </div>
                            {rep.isOk && (
                                <div className={`text-center w-full py-1.5 rounded-lg border bg-emerald-50/50 border-emerald-100`}>
                                    <span className={`block font-bold text-[10px] uppercase tracking-wider text-emerald-600`}>
                                        Tudo OK (Baixado)
                                    </span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeView, setActiveView] = useState("Visão Geral");
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedRep, setSelectedRep] = useState(null);
            
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [usersData, setUsersData] = useState([]); // Inicia vazio para não piscar dados velhos

            // Ouvinte de Tempo Real do Firebase (INTEGRADO COM O GESTOR)
            useEffect(() => {
                const activeSessionRef = doc(db, "configuracoes", "sessaoAtiva");
                let unsubscribeSession = null;
                let unsubscribeData = null;

                // Necessário autenticar anonimamente para passar nas regras de segurança do Firestore
                signInAnonymously(auth).then(() => {
                    unsubscribeSession = onSnapshot(activeSessionRef, async (docSnap) => {
                        const activeSessionId = docSnap.exists() ? docSnap.data().current : null;
                        
                        if (activeSessionId) {
                            try {
                                // Buscar os segmentos atualizados (que o Gestor guardou em vendedorConfig)
                                const configSnap = await getDocs(collection(db, "vendedorConfig"));
                                const segmentCache = {};
                                configSnap.forEach(d => { segmentCache[d.id] = d.data().segmento; });

                                if (unsubscribeData) unsubscribeData();

                                // Ouvir as amostras dos vendedores EM TEMPO REAL
                                unsubscribeData = onSnapshot(collection(db, "sessoes", activeSessionId, "vendedores"), (snapshot) => {
                                    const formatted = [];
                                    
                                    snapshot.docs.forEach(vendorDoc => {
                                        const data = vendorDoc.data();
                                        const sellerName = data.originalName || vendorDoc.id;
                                        const amostras = data.amostras || [];
                                        
                                        // Normalize id para buscar o segmento
                                        const normalizeText = (text = '') => text ? text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : '';
                                        const sanitizeForFirebaseId = (text) => normalizeText(text).replace(/\//g, "-");
                                        
                                        const sellerId = sanitizeForFirebaseId(sellerName);
                                        
                                        // Limpar espaços extras e padronizar para maiúsculas para evitar duplicados
                                        let segmentRaw = segmentCache[sellerId] || "Sem Segmento";
                                        let segment = segmentRaw.toUpperCase().trim();
                                        
                                        // Mapa de Correção Ortográfica e Siglas
                                        const segmentCorrections = {
                                            "SMB": "SNACKS, MOLHOS E BEBIDAS",
                                            "CARNEOS": "CÁRNEOS",
                                            "LACTEOS": "LÁCTEOS",
                                            "NUTRICAO ANIMAL": "NUTRIÇÃO ANIMAL",
                                            "NUTRICAO ESPORTIVA": "NUTRIÇÃO ESPORTIVA",
                                            "EXPORTACAO": "EXPORTAÇÃO",
                                            "PANIFICACAO": "PANIFICAÇÃO",
                                            "NUTRIÇÃO ESPORTIVA": "NUTRIÇÃO ESPORTIVA" // caso venha já com algum acento diferente
                                        };

                                        if (segmentCorrections[segment]) {
                                            segment = segmentCorrections[segment];
                                        }

                                        // Calcula as pendências exatamente como no Gestor
                                        let pendingCount = 0;
                                        let completedCount = 0;
                                        let systemBaixado = true;

                                        amostras.forEach(s => {
                                            if (s.systemStatus !== 'baixado') systemBaixado = false;
                                            if (s.isPending) {
                                                pendingCount++;
                                            } else {
                                                completedCount++;
                                            }
                                        });

                                        if (systemBaixado) {
                                            pendingCount = 0; // Se o gestor deu baixa global, zera a pendencia
                                            completedCount = amostras.length; // e considera todos como concluídos
                                        }

                                        const isOk = pendingCount === 0;

                                        formatted.push({
                                            name: sellerName,
                                            segment: segment,
                                            statusText: isOk ? "Baixado" : `${pendingCount} pendente(s)`,
                                            isOk,
                                            isPending: !isOk,
                                            pendingCount,
                                            completedCount,
                                            totalCount: amostras.length
                                        });
                                    });
                                    
                                    setUsersData(formatted); // Atualiza os blocos da tela!
                                });
                            } catch (error) {
                                console.error("Erro ao sincronizar os dados dos vendedores:", error);
                            }
                        }
                    }, (error) => {
                        console.error("Erro ao sincronizar Sessão:", error);
                    });
                }).catch((error) => {
                    console.error("Erro ao autenticar no Firebase:", error);
                });

                return () => {
                    if (unsubscribeSession) unsubscribeSession();
                    if (unsubscribeData) unsubscribeData();
                };
            }, []);

            const segments = useMemo(() => {
                const unique = [...new Set(usersData.map(item => item.segment))];
                return unique.sort();
            }, [usersData]);

            // Vendedores baseados no Filtro e Pesquisa
            const displayedReps = useMemo(() => {
                let filtered = usersData;
                
                if (activeView !== "Visão Geral") {
                    filtered = filtered.filter(rep => rep.segment === activeView);
                }

                if (searchTerm) {
                    filtered = filtered.filter(rep => rep.name.toLowerCase().includes(searchTerm.toLowerCase()));
                }

                // Ordena: Bloqueados primeiro, depois por nome alfabético
                return filtered.sort((a, b) => {
                    if (a.isPending && !b.isPending) return -1;
                    if (!a.isPending && b.isPending) return 1;
                    return a.name.localeCompare(b.name);
                });
            }, [activeView, searchTerm, usersData]);

            // Métricas Globais
            const stats = useMemo(() => {
                const total = usersData.length;
                const blocked = usersData.filter(r => r.isPending).length;
                const ok = total - blocked;
                return { total, blocked, ok };
            }, [usersData]);

            return (
                <div className="flex w-full h-full bg-slate-100 overflow-hidden relative">
                    
                    {/* STATUS MODAL */}
                    <StatusModal rep={selectedRep} onClose={() => setSelectedRep(null)} />

                    {/* SIDEBAR (MENU LATERAL) */}
                    <div className={`transition-all duration-300 ease-in-out flex-shrink-0 z-20 bg-white border-r border-slate-200 shadow-sm overflow-hidden ${isSidebarOpen ? 'w-72' : 'w-0 border-none'}`}>
                        <aside className="w-72 text-slate-700 flex flex-col h-full">
                            {/* Logo Area */}
                            <div className="h-20 flex items-center px-6 border-b border-slate-100 bg-white">
                                <img src="https://i.postimg.cc/D8m6nWtf/as-02-(1).png" alt="Logo" className="h-8 object-contain" />
                            </div>

                            {/* Navigation */}
                            <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1 custom-scrollbar">
                                <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Menu Principal</p>
                                
                                <button 
                                    onClick={() => setActiveView("Visão Geral")}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all font-bold text-sm
                                        ${activeView === "Visão Geral" ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-100 text-slate-600 hover:text-indigo-600'}
                                    `}
                                >
                                    <Icons.PieChart className="w-5 h-5" /> Visão Geral
                                </button>

                                <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-8 mb-3">Segmentos</p>
                                
                                {segments.map(seg => {
                                    const segReps = usersData.filter(r => r.segment === seg);
                                    const pendingInSeg = segReps.filter(r => r.isPending).length;

                                    return (
                                        <button 
                                            key={seg}
                                            onClick={() => setActiveView(seg)}
                                            className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition-all text-sm group font-medium
                                                ${activeView === seg ? 'bg-slate-100 text-indigo-700 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-indigo-600'}
                                            `}
                                        >
                                            <div className="flex items-center gap-3 truncate pr-2">
                                                <div className={`w-2 h-2 rounded-full ${pendingInSeg > 0 ? 'bg-brand-red' : 'bg-brand-green'}`}></div>
                                                <span className="truncate text-left">{seg}</span>
                                            </div>
                                            {pendingInSeg > 0 && (
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${activeView === seg ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-500 group-hover:bg-red-50 group-hover:text-red-500'}`}>
                                                    {pendingInSeg}
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                            </nav>
                            
                            <div className="p-4 border-t border-slate-200 bg-slate-50">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-white shadow-sm border border-slate-200 rounded-full flex items-center justify-center">
                                        <Icons.Users className="w-5 h-5 text-indigo-500" />
                                    </div>
                                    <div>
                                        <p className="text-xs font-medium text-slate-500">Total no Sistema</p>
                                        <p className="text-sm font-bold text-slate-800">{stats.total} Vendedores</p>
                                    </div>
                                </div>
                            </div>
                        </aside>
                    </div>

                    {/* CONTEÚDO PRINCIPAL */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Header Fixo */}
                        <header className="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-10">
                            <div className="flex items-center gap-4">
                                {/* Botão que abre e fecha o Menu Lateral */}
                                <button 
                                    onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                    className="p-2 -ml-3 hover:bg-slate-100 text-slate-500 rounded-lg transition-colors flex items-center justify-center"
                                    title="Abrir/Fechar Menu"
                                >
                                    <Icons.Menu className="w-6 h-6" />
                                </button>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-slate-800">{activeView}</h1>
                                    <p className="text-sm text-slate-500 font-medium">Gestão de Bloqueios e Feedbacks</p>
                                </div>
                            </div>

                            <div className="relative w-80">
                                <Icons.Search className="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                                <input 
                                    type="text" 
                                    placeholder="Buscar vendedor..." 
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium transition-all"
                                />
                            </div>
                        </header>

                        {/* Área Rolável */}
                        <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            
                            {/* ESTADO VAZIO / CARREGANDO */}
                            {usersData.length === 0 && (
                                <div className="flex flex-col items-center justify-center h-full text-slate-400">
                                    <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mb-4"></div>
                                    <p className="font-medium animate-pulse">Buscando dados no sistema...</p>
                                </div>
                            )}

                            {/* DASHBOARD VIEW */}
                            {activeView === "Visão Geral" && !searchTerm && usersData.length > 0 && (
                                <div className="space-y-8 animate-fade-in">
                                    {/* Cards Superiores */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                                            <span className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-2">Total Analisados</span>
                                            <span className="text-4xl font-black text-slate-800">{stats.total}</span>
                                        </div>
                                        <div className="bg-red-50 p-6 rounded-2xl border border-red-100 flex flex-col relative overflow-hidden">
                                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-red-500 opacity-10 rounded-full"></div>
                                            <span className="text-sm font-bold text-red-600 uppercase tracking-widest mb-2 flex items-center gap-2"><Icons.AlertCircle className="w-4 h-4"/> Vendedores Bloqueados</span>
                                            <span className="text-4xl font-black text-red-600">{stats.blocked}</span>
                                        </div>
                                        <div className="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 flex flex-col relative overflow-hidden">
                                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-emerald-500 opacity-10 rounded-full"></div>
                                            <span className="text-sm font-bold text-emerald-600 uppercase tracking-widest mb-2 flex items-center gap-2"><Icons.CheckCircle className="w-4 h-4"/> Tudo OK (Baixado)</span>
                                            <span className="text-4xl font-black text-emerald-600">{stats.ok}</span>
                                        </div>
                                    </div>

                                    {/* Linha de Gráficos */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-slate-800 mb-6">Status Geral (Com Pendência vs Baixado)</h3>
                                            <DoughnutChart data={usersData} />
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-slate-800 mb-6">Vendedores Bloqueados por Segmento</h3>
                                            <BarChart data={usersData} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* GRID DE VENDEDORES (Para Visão de Segmento ou Busca) */}
                            {((activeView !== "Visão Geral" || searchTerm) && usersData.length > 0) && (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                            <Icons.Users className="w-5 h-5 text-indigo-500" />
                                            {searchTerm ? `Resultados da busca: "${searchTerm}"` : `Vendedores em ${activeView}`}
                                        </h2>
                                        <span className="px-3 py-1 bg-slate-200 text-slate-700 rounded-full text-xs font-bold">{displayedReps.length} registros</span>
                                    </div>

                                    {displayedReps.length === 0 ? (
                                        <div className="text-center py-20 bg-white rounded-2xl border border-slate-200 border-dashed">
                                            <Icons.Search className="w-12 h-12 text-slate-300 mx-auto mb-4" />
                                            <h3 className="text-lg font-bold text-slate-600">Nenhum vendedor encontrado</h3>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                                            {displayedReps.map((rep, idx) => (
                                                <RepCard key={`${rep.name}-${idx}`} rep={rep} onClick={setSelectedRep} />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                            
                            {/* Mostrar Todos se buscar em Visão Geral e não achar nada */}
                            {activeView === "Visão Geral" && searchTerm && displayedReps.length > 0 && (
                                <div className="mt-8 border-t border-slate-200 pt-8" />
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
